name: service_hive
description: "ServiceHive - Professional Home Services App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.0
  go_router: ^12.0.0
  provider: ^6.1.2
  flutter_animate: ^4.5.0
  shared_preferences: ^2.3.2
  supabase_flutter: ^2.0.0
  geolocator: ^13.0.1
  pinput: ^4.0.0
  lottie: ^3.1.2
  flutter_svg: ^2.0.10+1
  http: ^1.2.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1
  connectivity_plus: ^6.1.0
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#000000"
    theme_color: "#3b82f6"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
